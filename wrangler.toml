# ============================================================
# Wrangler 配置文件 — CDD World Encyclopedia（Cloudflare Pages 项目）
# 参考：https://developers.cloudflare.com/workers/wrangler/configuration/
# 注意：Pages 项目的 wrangler.toml **不能写 account_id**（会被校验拒绝）。
#       Account ID 的选择通过 CLOUDFLARE_ACCOUNT_ID 环境变量完成。
#       Token 需要的最小权限：User → User Details:Read + Account → Cloudflare Pages:Edit
# ============================================================

# Pages 项目名（绑定自定义域名 ccdworld.site）
name = "ccdwd"

# ⚠️ 顶层必需字段：静态文件输出目录
pages_build_output_dir = "out"

# Pages 兼容性日期
compatibility_date = "2025-08-25"

# 关闭遥测
send_metrics = false
