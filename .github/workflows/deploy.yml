# ============================================================
# CDD World Encyclopedia — GitHub Actions 自动部署工作流
# 触发条件：每次 push 到 main 分支时自动执行
# 流程：安装依赖 → next build 生成 out/ 静态产物 → cloudflare/pages-action@v1 直传
#
# ⚠️ GitHub Secrets（必须在仓库 Settings → Secrets and variables → Actions 中配置）：
#   - CLOUDFLARE_API_TOKEN：Cloudflare API Token
#     必需权限（缺任何一条会认证失败）：
#       · User → User Details → Read
#       · Account → Cloudflare Pages → Edit
#       · Account → Account Settings → Read
#   - CLOUDFLARE_ACCOUNT_ID：Cloudflare 账号 ID
#     当前值（已复制粘贴即可）：1d90f5e79f6a62bacc8ad6b04515debd
#
# Cloudflare Pages 项目名：ccdwd（绑定自定义域名 https://ccdworld.site）
# ============================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]            # 只在 main 分支推送时触发
  workflow_dispatch:            # 允许在 GitHub 网页手动触发

# 取消同一分支的旧运行，避免排队
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 统一 npm/node 参数：加速 + 防 OOM
      NODE_OPTIONS: --max-old-space-size=4096
      NPM_FLAGS: --no-audit --no-fund

    steps:
      # 0. 先确认 Secrets 是否设置（不显示值，只判断长度）
      - name: ⁰ Verify required GitHub Secrets are present
        run: |
          set -e
          echo "Checking CLOUDFLARE_API_TOKEN..."
          TOK="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          if [ -z "$TOK" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is EMPTY — go to Settings → Secrets and add it."
            exit 1
          fi
          echo "✅ CLOUDFLARE_API_TOKEN is set (length: ${#TOK})"

          echo "Checking CLOUDFLARE_ACCOUNT_ID..."
          AID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$AID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is EMPTY — go to Settings → Secrets and add it."
            exit 1
          fi
          echo "✅ CLOUDFLARE_ACCOUNT_ID is set (length: ${#AID}, expected 32): $AID"

      # Step 1：拉取代码
      - name: ① Checkout repository
        uses: actions/checkout@v4

      # Step 2：配置 Node.js 22
      - name: ② Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3：安装项目依赖
      - name: ③ Install project dependencies
        run: npm ci ${{ env.NPM_FLAGS }}

      # Step 4：执行 Next.js 静态构建（产出 out/ 目录，由 next.config.mjs 的 output:"export" 触发）
      - name: ④ Build static site (next export → out/)
        run: npm run build

      # Step 5：确认构建产物存在 + 数量正确（排错用）
      - name: ⑤ Verify build output
        run: |
          set -e
          echo "=== out/ directory top-level ==="
          ls -la out/ | head -30
          echo ""
          echo "=== Total static files ==="
          find out/ -type f | wc -l
          echo ""
          echo "=== _headers present  ? ===" ; test -f out/_headers && echo "YES" || { echo "NO" ; exit 1 ; }
          echo "=== _redirects present? ===" ; test -f out/_redirects && echo "YES" || { echo "NO" ; exit 1 ; }

      # Step 6：使用 Cloudflare 官方 Pages Action（v1）直接上传 out/ 目录
      #         文档：https://github.com/cloudflare/pages-action
      - name: ⑥ Upload out/ → Cloudflare Pages (project = ccdwd)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ccdwd
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
