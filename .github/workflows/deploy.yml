# ============================================================
# CDD World Encyclopedia — GitHub Actions 自动部署工作流
# 触发条件：每次 push 到 main 分支时自动执行
# 流程：安装依赖 → next build 生成 out/ 静态产物 → wrangler pages deploy 直传 Cloudflare
#
# ⚠️ 认证方式（与 Custom Token 方案相比更简单，不需要细分权限）：
#    使用 Cloudflare "Global API Key（全局 API 密钥）" + 注册邮箱
#    优势：不用手动配置 User → User Details:Read / Pages:Edit 等细分权限
#
# 必须在仓库 Settings → Secrets and variables → Actions 中配置以下 3 个 Repository secrets：
#
#   1) CLOUDFLARE_EMAIL
#      → Cloudflare 注册邮箱（你的账号：15378707620@163.com）
#
#   2) CLOUDFLARE_GLOBAL_API_KEY
#      → Cloudflare 全局 API 密钥（长度 37 位的纯十六进制小写字符串）
#        获取方法见下方说明
#
#   3) CLOUDFLARE_ACCOUNT_ID
#      → Cloudflare 账号 ID，当前值固定为：1d90f5e79f6a62bacc8ad6b04515debd
#
# Cloudflare Pages 项目名：ccdwd（绑定自定义域名 https://ccdworld.site）
# ============================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]            # 只在 main 分支推送时触发
  workflow_dispatch:            # 允许在 GitHub 网页手动触发

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ====== Wrangler 认证：Global API Key + Email ======
      # wrangler3 会自动识别这对环境变量，不再调 /memberships 需要 User:Read
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY:   ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 统一 npm/node 参数
      NODE_OPTIONS: --max-old-space-size=4096
      NPM_FLAGS: --no-audit --no-fund

      # Pages 项目名（绑定自定义域名 ccdworld.site）
      CF_PAGES_PROJECT: ccdwd

    steps:
      # Step 0：验证 Secrets 是否填写完整（只显示长度/存在性，不泄露值）
      - name: ⁰ Verify required GitHub Secrets are present
        run: |
          set -e
          fail=0

          echo "[1/3] CLOUDFLARE_EMAIL"
          EML="${{ secrets.CLOUDFLARE_EMAIL }}"
          if [ -z "$EML" ]; then
            echo "  ❌ EMPTY. 请在 Secrets 中设置为 Cloudflare 注册邮箱" ; fail=1
          else
            echo "  ✅ Set ($EML)"
          fi

          echo "[2/3] CLOUDFLARE_GLOBAL_API_KEY"
          KEY="${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}"
          LEN=${#KEY}
          if [ -z "$KEY" ]; then
            echo "  ❌ EMPTY. 请在 Secrets 中设置 Cloudflare Global API Key（37 位小写十六进制）" ; fail=1
          else
            echo "  ✅ Set (length=$LEN, expected=37)"
          fi

          echo "[3/3] CLOUDFLARE_ACCOUNT_ID"
          AID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$AID" ]; then
            echo "  ❌ EMPTY. 请设置为 1d90f5e79f6a62bacc8ad6b04515debd" ; fail=1
          else
            echo "  ✅ Set ($AID, length=${#AID})"
          fi

          if [ "$fail" != "0" ]; then
            echo ""
            echo "❌ Secrets 配置不完整。请前往："
            echo "   https://github.com/jinbohao1688/cdd-encyclopedia/settings/secrets/actions"
            exit 1
          fi
          echo "✅ 所有 Secrets 配置完毕 ✓"

      # Step 1：拉取代码
      - name: ① Checkout repository
        uses: actions/checkout@v4

      # Step 2：配置 Node.js 22
      - name: ② Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3：安装项目依赖
      - name: ③ Install project dependencies
        run: npm ci ${{ env.NPM_FLAGS }}

      # Step 4：执行 Next.js 静态构建（产出 out/ 目录，由 next.config.mjs 的 output:"export" 触发）
      - name: ④ Build static site (next export → out/)
        run: npm run build

      # Step 5：确认构建产物
      - name: ⑤ Verify build output
        run: |
          set -e
          echo "=== Total static files ==="
          find out/ -type f | wc -l
          echo "=== _headers & _redirects check ==="
          test -f out/_headers && echo "_headers: YES" || { echo "_headers MISSING ❌" ; exit 1 ; }
          test -f out/_redirects && echo "_redirects: YES" || { echo "_redirects MISSING ❌" ; exit 1 ; }

      # Step 6：安装 wrangler
      - name: ⑥ Install wrangler CLI (v3)
        run: npm install --no-save wrangler@3 ${{ env.NPM_FLAGS }}

      # Step 7：部署 out/ → Cloudflare Pages
      #         说明：有 wrangler.toml（name=ccdwd, pages_build_output_dir=out）
      #         + CLOUDFLARE_EMAIL/CLOUDFLARE_API_KEY 全局密钥认证，
      #         完全绕开 Custom Token 的 User Details:Read 细分权限问题
      - name: ⑦ Deploy out/ → Cloudflare Pages (project = ccdwd)
        run: npx wrangler pages deploy out --project-name="$CF_PAGES_PROJECT" --branch=main
